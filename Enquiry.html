<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Sweet Crumbs Bakery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>Sweet Crumbs Bakery</h1>
            <p class="tagline">Lets Enjoy Some Goodies</p>
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="Home.html">Home</a></li>
                <li><a href="ContactUs.html">Contact Us</a></li>
                <li><a href="AboutUs.html">About Us</a></li>
                <li><a href="Enquiry.html" class="active">Enquiry</a></li>   
                <li><a href="Gallery.html">Gallery</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Product Enquiry</h1>
        <div class="form-container">
            <form class="contact-form" action="https://formsubmit.co/b850daf1e7ab794d1e0832529ccf1f25" method="POST">
                <input type="text" name="_honey" style="display: none;">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="http://127.0.0.1:5500/success2.html">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input id="name" type="text" placeholder="Your Name" name="Name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="Your Email" name="Email" required>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input id="phoneNumber" type="tel" placeholder="Your Phone Number" name="phoneNumber" required>
                </div>

                <div class="form-group">
                    <label for="orderID">Order ID (Optional)</label>
                    <input id="orderID" type="text" placeholder="Order ID" name="orderID">
                </div>

                <div class="form-group">
                    <label for="productInterest">Product Interest</label>
                    <input id="productInterest" type="text" placeholder="e.g. Custom Birthday Cake" name="productInterest" required>
                </div>

                <div class="form-group">
                    <label for="Questions">Questions about Product</label>
                    <textarea id="Questions" placeholder="Questions about Product" name="Questions" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="message">Additional Notes</label>
                    <textarea id="message" placeholder="Your Message" name="Message" rows="3"></textarea>
                </div>

                <button type="submit" class="btn">Submit Enquiry</button>
            </form>
        </div>
    </main>

</body>
</html>
